                  - text: — provenance digests for primitives, prompt, and LoRA; records under
                  - code [ref=e4858]: user/workflow_monitor
                  - text: .
              - paragraph [ref=e4859]: Silent video decode by default. Do not unmute Audio Decode until AV trim wiring exists.
              - heading "Prompt edit authority" [level=3] [ref=e4860]
              - paragraph [ref=e4861]: Shot Tag selects the committed named prompt/media/RefMod library entries. In Fantastic Prompt Builder, load the matching named library entry and Save/Commit it there; linked widget defaults are previews and do not override the package. The resolver re-reads the selected libraries on every queue and saves an immutable package snapshot under user/master_studio/packages. Run only Resolved Shot Package (node 28) to inspect its revision/source without loading models. Missing files stop resolution. Always refreshing the resolver may invalidate downstream conditioning caches; keep that policy fixed in A/B runs.
              - heading "Camera and reference control" [level=3] [ref=e4862]
              - paragraph [ref=e4863]: The Camera menu inserts words only when + Camera is pressed in the focused description; it is not a live camera setting. Check the generated Camera sentence and remove conflicting static/zoom instructions before committing the named library prompt. In source bindings, reference_layout=composition copies the picture layout; reference_layout=setting preserves set appearance and lets the shot own framing. SH04 uses setting-only guidance for its tighter reaction framing. Identity comes from the face reference; wardrobe comes from the clothing picture. These are text/reference controls, not geometric camera or pose constraints.
              - heading "Tested static insert route" [level=3] [ref=e4864]
              - paragraph [ref=e4865]: "For a motionless insert such as SH03, use the first package Picture through Static Plate 101→102→103→104; 105 builds the per-shot filename. It fits the delivery aspect by center crop without stretching and holds exactly the delivered frame count at the chosen FPS. No motion or new subjects are generated. Select Shot Tag MSG_S001_SH03, activate output104 and run only that output. For a full queue of this route, mute H3 ProjectSave61 and SaveVideo64 first, leaving Monitor44 enabled; restore those two outputs and mute104 for generative shots. The optional static output is muted by default. Files go under The_Message/master_studio_static_plates. A plate export has no H3 AV continuation latent; do not treat it as a continuation take. Native first-frame prompt instructions improve guidance but do not hard-pin pixels. Three diagnostic clips are preserved in the Camera Reference Tests tab; the generative static/anchor takes failed visual checks and were not selected. Use direct video playback/decoded frames: the panel contact sheet repeated its first frame in these tests."
