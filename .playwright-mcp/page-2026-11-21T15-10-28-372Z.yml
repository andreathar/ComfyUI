              - list [ref=e9260]:
                - listitem [ref=e9261]: Film Plan owns the shared bible, dimensions, default duration/steps/base seed and six structured shot prompts. Scene Editor and Studio edit this same plan. Native per-shot overrides win over defaults.
                - listitem [ref=e9262]: "Shared reference catalogue owns assets once and binds them by shot ID. Use {{asset-alias}} in shot text. The engine resolves aliases from Fantastic's actual map. LoRA preset A is empty; all shots use Base."
                - listitem [ref=e9263]: "Engine controls expose shot range, sampler and review. Start with one shot. Review enabled means approve/retry/stop with no timeout. Exact frames follow H3's 17k+5 grid: 3 seconds gives 73 frames."
                - listitem [ref=e9264]: "Run only CPU preflight #31 to inspect the selected shot's final prompt/map. Normal film execution records resources with Monitor Brain. Measurements do not judge creative quality."
                - listitem [ref=e9265]: "Optional purple/brown modules are muted: Fantastic draft authoring, Project Suite manual continuation, manifest recovery and encode loading. They are separate tools, not extra automatic renders."
              - paragraph [ref=e9266]: "Fresh destination: The_Message/workbench/v001. Change run_name/output_subfolder together for another experiment. Reference and LoRA changes affect resume fingerprint; change run_name for model/preset revisions. Candidate assets remain pending human selection."
