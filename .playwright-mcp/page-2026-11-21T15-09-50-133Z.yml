                      - textbox [ref=e9437]: "{ \"prompt_prefix\": \"Film bible: The Message. Naturalistic live-action photography with restrained contrast. Soft daylight from black-framed cafe windows at camera right. For shots featuring Andre, preserve the identity and wardrobe defined in the shot's subject definitions. Maintain consistent cafe architecture and screen direction. When the note is visible, show exactly one closed cream folded note. Each shot is one continuous locked-tripod take. Silent film: no dialogue, subtitles, captions, logos, added people or music.\", \"shots\": [ { \"id\": \"MSG_S001_SH01\", \"prompt\": [ \"subject_definitions:\", \"<Subject 1> is the environment shown in {{cafe-counter-wide-v1}}: {{var:cafe_environment}}\", \"\", \"summary:\", \"[reference generation] In <Subject 1>, The empty cafe remains still in daylight.\", \"\", \"retention_analysis:\", \"<Subject 1> (appears in [Shot 1]): partially_preserved - Preserve architecture, furniture and lighting; use the primary picture for camera layout.\", \"\", \"detailed_description:\", \"Apply the shared film bible for photography and lighting.\", \"[Shot 1] One continuous wide shot, eye-level, 24mm lens. Camera: static. Environment: <Subject 1>, primary camera layout from {{cafe-counter-wide-v1}}. The empty cafe remains still in daylight. Keep visible in the same frame: espresso counter left; windows right; round table. No people, faces or hands visible. Locked tripod. One continuous shot. No zoom or cut inside the shot. No subtitles, captions, logos, dialogue or added people.\", \"\", \"overall_soundscape:\", \"No speech, music or sound effects.\", \"\", \"non_diegetic_music:\", \"N/A\" ], \"lora_route\": \"Base\" }, { \"id\": \"MSG_S001_SH02\", \"prompt\": [ \"subject_definitions:\", \"<Subject 1> is Andre, whose identity is shown in {{andre-identity-video-v1}}. Their name is Andre.\", \"<Subject 2> is the environment shown in {{cafe-window-table-v1}}: {{var:cafe_environment}}\", \"{{cafe-wardrobe-candidate-v1}} is a wardrobe reference for MSG-CHR-ANDRE.\", \"\", \"summary:\", \"[reference generation] In <Subject 2>, Andre sits at the window table and slowly lowers his gaze toward the note.\", \"\", \"retention_analysis:\", \"<Subject 1> (appears in [Shot 1]): fully_preserved - Preserve facial identity from {{andre-identity-video-v1}}.\", \"<Subject 2> (appears in [Shot 1]): partially_preserved - Preserve architecture, furniture and lighting; use the primary picture for camera layout.\", \"{{cafe-wardrobe-candidate-v1}} (appears in [Shot 1]): attribute_transfer - Use as wardrobe reference.\", \"\", \"detailed_description:\", \"Apply the shared film bible for photography and lighting.\", \"[Shot 1] One continuous medium-wide shot, eye-level, 35mm lens. Camera: static. Environment: <Subject 2>, primary camera layout from {{cafe-window-table-v1}}. <Subject 1> (S1): {{var:andre_description}} Wears {{var:wardrobe_description}} as shown in {{cafe-wardrobe-candidate-v1}}. Andre sits at the window table and slowly lowers his gaze toward the note. Keep visible in the same frame: round table; black-framed windows; one closed cream note flat on the tabletop. Gaze target: the closed cream note on the table. Expression: neutral, lips relaxed and closed. His hands remain clasped still in his lap below the table edge, out of frame. One closed cream note rests untouched near the left side of the tabletop. Locked tripod. One continuous shot. No zoom or cut inside the shot. No subtitles, captions, logos, dialogue or added people.\", \"\", \"overall_soundscape:\", \"No speech, music or sound effects.\", \"\", \"non_diegetic_music:\", \"N/A\" ], \"lora_route\": \"Base\" }, { \"id\": \"MSG_S001_SH03\", \"prompt\": [ \"subject_definitions:\", \"<Subject 1> is the environment shown in {{cafe-table-note-insert-v2}}: Tight overhead macro surface of a warm pale oak wooden cafe tabletop in soft natural daylight, with one closed rectangular cream folded paper note resting flat in the upper-left quadrant and empty wood grain filling the rest of the frame.\", \"\", \"summary:\", \"[reference generation] In <Subject 1>, One closed rectangular cream paper note rests completely motionless on the warm oak wooden tabletop surface in tight overhead close-up.\", \"\", \"retention_analysis:\", \"<Subject 1> (appears in [Shot 1]): partially_preserved - Preserve tabletop wood grain, paper fold geometry, close-up camera distance and lighting; Overhead tabletop close-up: preserve the single closed rectangular cream folded note/envelope resting flat in the upper-left quadrant of the warm oak wooden tabletop; keep wood grain and soft directional shadow motionless.\", \"\", \"detailed_description:\", \"Apply the shared film bible for photography and lighting.\", \"[Shot 1] One continuous close-up shot, overhead, macro lens. Camera: static. Environment: <Subject 1>, primary camera layout from {{cafe-table-note-insert-v2}}. One closed rectangular cream paper note rests completely motionless on the warm oak wooden tabletop surface in tight overhead close-up. Keep visible in the same frame: one closed folded cream note in upper-left quadrant; warm oak wooden tabletop wood grain filling the entire frame from start to finish. Fixed locked-down macro tabletop insert for the entire duration. Keep the exact close-up tabletop framing of {{cafe-table-note-insert-v2}} from first frame to last frame; never pull out, pan, cut, or reveal chairs, counters, walls, windows or room interior. No people, faces or hands visible. Locked tripod. One continuous shot. No zoom or cut inside the shot. No subtitles, captions, logos, dialogue or added people.\", \"\", \"overall_soundscape:\", \"No speech, music or sound effects.\", \"\", \"non_diegetic_music:\", \"N/A\" ], \"lora_route\": \"Base\" }, { \"id\": \"MSG_S001_SH04\", \"prompt\": [ \"subject_definitions:\", \"<Subject 1> is Andre, whose identity is shown in {{andre-identity-video-v1}}. Their name is Andre.\", \"<Subjec