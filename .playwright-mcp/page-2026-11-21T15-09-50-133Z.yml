Subject 2> is the environment shown in {{cafe-counter-wide-v1}}: {{var:cafe_environment}}\", \"{{cafe-wardrobe-candidate-v1}} is a wardrobe reference for MSG-CHR-ANDRE.\", \"\", \"summary:\", \"[reference generation] In <Subject 2>, Andre remains seated at the window table and makes one slight nod.\", \"\", \"retention_analysis:\", \"<Subject 1> (appears in [Shot 1]): fully_preserved - Preserve facial identity from {{andre-identity-video-v1}}.\", \"<Subject 2> (appears in [Shot 1]): partially_preserved - Preserve architecture, furniture and lighting; use the primary picture for camera layout.\", \"{{cafe-wardrobe-candidate-v1}} (appears in [Shot 1]): attribute_transfer - Use as wardrobe reference.\", \"\", \"detailed_description:\", \"Apply the shared film bible for photography and lighting.\", \"[Shot 1] One continuous wide shot, eye-level, 24mm lens. Camera: static. Environment: <Subject 2>, primary camera layout from {{cafe-counter-wide-v1}}. <Subject 1> (S1): {{var:andre_description}} Wears {{var:wardrobe_description}} as shown in {{cafe-wardrobe-candidate-v1}}. Andre remains seated at the window table and makes one slight nod. Keep visible in the same frame: espresso counter left; windows right; round table. Gaze target: the table. Expression: neutral, lips relaxed and closed. His hands remain still in his lap below the table edge while one closed cream note sits undisturbed on the tabletop. Locked tripod. One continuous shot. No zoom or cut inside the shot. No subtitles, captions, logos, dialogue or added people.\", \"\", \"overall_soundscape:\", \"No speech, music or sound effects.\", \"\", \"non_diegetic_music:\", \"N/A\" ], \"lora_route\": \"Base\" } ] }"
