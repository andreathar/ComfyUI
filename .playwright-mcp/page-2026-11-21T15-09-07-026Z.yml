              - list [ref=e4709]:
                - listitem [ref=e4710]:
                  - strong [ref=e4711]: Common Variables Bus
                  - text: — Project Name feeds Hub directly. Shot Tag selects the full shot package (prompt/media/RefMod/seed/transition). Duration preview shows
                  - strong [ref=e4712]: raw vs delivered
                  - text: frames.
                - listitem [ref=e4713]:
                  - strong [ref=e4714]: Transition
                  - text: — package default is
                  - code [ref=e4715]: cut
                  - text: .
                  - code [ref=e4716]: continue
                  - text: "only arms H3 Context when Hub has an approved tail; Frame-grid rounding affects delivery: at 3s/24fps, cut delivers 73f; continue samples 107f, trims 22f and delivers 85f. Read the raw/delivered preview before running."
                - listitem [ref=e4717]:
                  - strong [ref=e4718]: Structured Prompts
                  - text: — package resolver drives Media / Prompt Builder / RefMod / Seed. Node
                  - code [ref=e4719]: "24"
                  - text: lists reference tags on CPU.
                - listitem [ref=e4720]:
                  - strong [ref=e4721]: Subgraphs
                  - text: — Model/LoRA
                  - code [ref=e4722]: "30"
                  - text: ", Conditioning/Context"
                  - code [ref=e4723]: "40"
                  - text: ", Sampler/Decode/Trim"
                  - code [ref=e4724]: "50"
                  - text: . Labs
                  - code [ref=e4725]: "70"
                  - text: /
                  - code [ref=e4726]: "80"
                  - text: stay muted.
                - listitem [ref=e4727]:
                  - strong [ref=e4728]: H3 Project Suite
                  - text: — Open project… on Hub (resolved project name). Approve before a continue take.
                - listitem [ref=e4729]:
                  - strong [ref=e4730]: WorkflowMonitorBrain
                  - text: — provenance digests for primitives, prompt, and LoRA; records under
                  - code [ref=e4731]: user/workflow_monitor
                  - text: .
              - paragraph [ref=e4732]: Silent video decode by default. Do not unmute Audio Decode until AV trim wiring exists.
              - heading "Prompt edit authority" [level=3] [ref=e4733]
              - paragraph [ref=e4734]: Shot Tag selects the committed named prompt/media/RefMod library entries. In Fantastic Prompt Builder, load the matching named library entry and Save/Commit it there; linked widget defaults are previews and do not override the package. The resolver re-reads the selected libraries on every queue and saves an immutable package snapshot under user/master_studio/packages. Run only Resolved Shot Package (node 28) to inspect its revision/source without loading models. Missing files stop resolution. Always refreshing the resolver may invalidate downstream conditioning caches; keep that policy fixed in A/B runs.
              - heading "Camera and reference control" [level=3] [ref=e4735]
              - paragraph [ref=e4736]: The Camera menu inserts words only when + Camera is pressed in the focused description; it is not a live camera setting. Check the generated Camera sentence and remove conflicting static/zoom instructions before committing the named library prompt. In source bindings, reference_layout=composition copies the picture layout; reference_layout=setting preserves set appearance and lets the shot own framing. SH04 uses setting-only guidance for its tighter reaction framing. Identity comes from the face reference; wardrobe comes from the clothing picture. These are text/reference controls, not geometric camera or pose constraints.
              - heading "Tested static insert route" [level=3] [ref=e4737]
              - paragraph [ref=e4738]: "For a motionless insert such as SH03, use the first package Picture through Static Plate 101→102→103→104; 105 builds the per-shot filename. It fits the delivery aspect by center crop without stretching and holds exactly the delivered frame count at the chosen FPS. No motion or new subjects are generated. Select Shot Tag MSG_S001_SH03, activate output104 and run only that output. For a full queue of this route, mute H3 ProjectSave61 and SaveVideo64 first, leaving Monitor44 enabled; restore those two outputs and mute104 for generative shots. The optional static output is muted by default. Files go under The_Message/master_studio_static_plates. A plate export has no H3 AV continuation latent; do not treat it as a continuation take. Native first-frame prompt instructions improve guidance but do not hard-pin pixels. Three diagnostic clips are preserved in the Camera Reference Tests tab; the generative static/anchor takes failed visual checks and were not selected. Use direct video playback/decoded frames: the panel contact sheet repeated its first frame in these tests."
