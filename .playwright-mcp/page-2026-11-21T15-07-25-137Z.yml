                    - text: "import json import hashlib import uuid import re from pathlib import Path PROJECT = Path('/mnt/data/Projects_SSD/ComfyUI/studio/projects/the-message/silent-proof-v001') PROMPTS = Path('/mnt/data/Projects_SSD/ComfyUI/user/minimax_h3_prompts') MEDIA = Path('/mnt/data/Projects_SSD/ComfyUI/user/minimax_h3_presets') REFMODS = Path('/mnt/data/Projects_SSD/ComfyUI/user/minimax_h3_refmod_presets') TRANSITIONS = Path('/mnt/data/Projects_SSD/ComfyUI/studio/projects/the-message/silent-proof-v001/shot_transitions.json') SNAPSHOTS = Path('/mnt/data/Projects_SSD/ComfyUI/user/master_studio/packages') PROMPT_FILES = {'MSG_S001_SH01': 'The Message _ 01 _ Cafe Wide Establishing.json', 'MSG_S001_SH02': 'The Message _ 02 _ Window Table Gaze.json', 'MSG_S001_SH03': 'The Message _ 03 _ Tabletop Note Insert.json', 'MSG_S001_SH04': 'The Message _ 04 _ Window Reaction.json', 'MSG_S001_SH05': 'The Message _ 05 _ Reverse Counter Gaze.json', 'MSG_S001_SH06': 'The Message _ 06 _ Closing Wide Master.json'} GUIDE = 'https://huggingface.co/MiniMaxAI/MiniMax-H3/blob/main/docs/VIDEO_PROMPT_WRITING_GUIDE_ref_en.md' RULES_VERSION = 'h3-prompt-review-v1' def default_transitions(): return {shot_id: \"cut\" for shot_id in PROMPT_FILES} def load_transitions(): if TRANSITIONS.exists(): data = json.loads(TRANSITIONS.read_text(encoding=\"utf-8\")) out = default_transitions() out.update({k: str(v).lower() for k, v in data.items() if k in out}) return out return default_transitions() def resolve_shot_package(shot_id): shot_id = str(shot_id).strip() if shot_id not in PROMPT_FILES: raise ValueError(f\"unknown shot package: {shot_id}\") bindings = json.loads((PROJECT / \"bindings.json\").read_text(encoding=\"utf-8\")) binding = bindings[shot_id] prompt = json.loads((PROMPTS / PROMPT_FILES[shot_id]).read_text(encoding=\"utf-8\")) media_path = MEDIA / f\"The Message _ {shot_id} Media.json\" media = json.loads(media_path.read_text(encoding=\"utf-8\")) refmod_path = REFMODS / f\"The Message _ {shot_id} RefMods.json\" if refmod_path.exists(): refmod = json.loads(refmod_path.read_text(encoding=\"utf-8\")) stack_state = {\"picks\": refmod.get(\"picks\", []), \"budget\": refmod.get(\"budget\", 0)} else: stack_state = {\"picks\": [], \"budget\": 0} transition = load_transitions().get(shot_id, \"cut\") return { \"shot_id\": shot_id, \"prompt_text\": prompt.get(\"prompt\") or \"\", \"builder_state\": prompt.get(\"state\") or {}, \"media_state\": media.get(\"items\", []), \"stack_state\": stack_state, \"seed\": int(binding.get(\"seed\", 0)), \"transition\": transition, \"prompt_name\": prompt.get(\"name\") or PROMPT_FILES[shot_id], } def render_prompt(state): ref = state['ref'] definitions = [] for item in ref['subjectDefs']: if item.get('off'): continue line = item['text'].strip() if item.get('name') and re.match(r'<Subject \\d+>', line): line = line.rstrip('. ') + f\". Their name is {item['name']}.\" definitions.append(line) return '\\n\\n'.join([ 'subject_definitions:\\n' + '\\n'.join(definitions), 'summary:\\n[' + ' + '.join(ref['summaryTypes']) + '] ' + ref['summaryText'], 'retention_analysis:\\n' + '\\n'.join(f\"{x['label']}\" + (f\" ({x['context']})\" if x.get('context') else '') + f\": {x['marker']} - {x['note'].strip()}\" for x in ref['retention'] if not x.get('off')), 'detailed_description:\\n' + ref['styleLine'] + '\\n' + ref['detail'], 'overall_soundscape:\\n' + ref['soundscape'], 'non_diegetic_music:\\n' + ref['music'], ]) def review_digest(value): return hashlib.sha256(json.dumps(value, sort_keys=True, ensure_ascii=False, separators=(',', ':'), allow_nan=False).encode()).hexdigest() def review_prompt(text, state, *, expected_text=None, expected_mode='REF', reference_labels=None, duration=None, package_revision=None, seed=None): findings = [] def note(code, message): findings.append({'code': code, 'message': message}) state_sha256 = review_digest(state) if not isinstance(state, dict): state, expected_text = {}, None note('invalid_state', 'Editor state is not an object; the committed prompt remains unchanged and state parity is unverified.') off = state.get('off') if isinstance(state.get('off'), dict) else {} mode = state.get('mode', 'REF') if mode != expected_mode: note('mode_mismatch', 'Builder mode differs from the configured workflow profile.') if expected_text is not None and text.strip() != expected_text.strip(): note('state_text_mismatch', 'Saved prompt text differs from the supported state renderer; review the committed text and state together.') expected_sections = (['subject_definitions', 'summary', 'retention_analysis', 'detailed_description', 'overall_soundscape', 'non_diegetic_music'] if mode == 'REF' else ['integrated_multimodal_description', 'overall_soundscape', 'non_diegetic_music']) sections = re.findall(r'(?m)^([a-z_]+):', text) enabled = [name for name in expected_sections if not off.get(name)] if sections != enabled: note('section_structure', 'Prompt sections differ from the enabled sections for this mode.') cited = sorted(set(re.findall(r'<(?:Picture|Video|Audio) \\d+>', text))) if reference_labels is None: note('reference_map_unverified', 'Final encoder reference labels are unavailable; no missing reference is inferred.') else: missing = sorted(set(cited) - set(reference_labels)) if missing: note('missing_reference', 'Cited references absent from the provided map: ' + ', '.join(missing)) if re.search(r'\\(S\\d+\\)', text) and not re.search(r'<d>', text) and re.search(r'no (?:speech|dialogue)', text, re.I): note('silent_speaker', 'A silent prompt contains a vocal-source ID; remove it only after reviewing the intended audio.') body = text.split('detailed_description:', 1)[-1].split('overall_soundscape:', 1)[0] if mode == 'REF' else text if not re.search(r'\\[Shot 1\\]', body): note('shot_opening', 'The description has no [Shot 1] opening.') locked = re.search(r'(?:camera\\s*:\\s*static|locked tripod|camera holds a static shot)', body, re.I) moving = re.search(r'(?:camera (?:slowly )?(?:pushes|pulls|pans|trucks|arcs|tracks)|(?:push-in|pull-back|dolly|tracking) (?:movement|shot))', body, re.I) if locked and moving: note('camera_conflict', 'The shot contains both a locked camera instruction and a camera movement; check whether the change is intentional.') for minutes, seconds in re.findall(r'\\[Shot \\d+\\]\\s+At (\\d+):(\\d+(?:\\.\\d+)?)', body): if isinstance(duration, (int, float)) and int(minutes) * 60 + float(seconds) >= duration: note('shot_timing', 'A shot cut is at or beyond the requested duration.') if mode == 'REF': defs = text.split('subject_definitions:', 1)[-1].split('summary:', 1)[0] retention = text.split('retention_analysis:', 1)[-1].split('detailed_description:', 1)[0] for label in sorted(set(re.findall(r'<Subject \\d+>', text))): if label not in defs or label not in retention: note('subject_role', label + ' needs a consistent definition and retention role.') for label in cited: anchor = any(label in sentence and re.search(r'camera layout|composition|first frame|keyframe', sentence, re.I) for sentence in re.split(r'[.\\n]', body)) if label.startswith('<Picture') and anchor and label not in retention: note('picture_role', label + ' has a composition/frame role but no explicit retention entry.') result = {'rules_version': RULES_VERSION, 'guide': GUIDE, 'profile': 'h3-ref2va' if expected_mode == 'REF' else 'h3-base-' + expected_mode.lower(), 'profile_basis': 'configured workflow profile; loaded model identity unverified', 'prompt_sha256': hashlib.sha256(text.encode()).hexdigest(), 'state_sha256': state_sha256, 'package_revision': package_revision, 'resolved_seed': seed, 'state_parity': 'unverified' if expected_text is None else 'matched' if text.strip() == expected_text.strip() else 'mismatch', 'reference_coverage': 'unverified' if reference_labels is None else 'provided map', 'reference_labels': reference_labels, 'cited_labels': cited, 'findings': findings[:64], 'blocks_generation': False} result['review_sha256'] = review_digest(result) return result def package_review(pkg, revision): state = pkg['builder_state'] if isinstance(pkg['builder_state'], dict) else {} ref = state.get('ref') if isinstance(state.get('ref'), dict) else {} supported = (state.get('mode') == 'REF' and all(k in ref for k in ('subjectDefs', 'summaryTypes', 'summaryText', 'retention', 'styleLine', 'detail', 'soundscape', 'music')) and not any((state.get('off') or {}).values()) and '!' not in pkg['prompt_text'] and not any(d.get('voice') for d in ref.get('subjectDefs', []))) labels = None if not any(p.get('on', True) for p in pkg['stack_state'].get('picks', [])): counts = {'picture': 0, 'video': 0, 'audio': 0} for item in pkg['media_state']: if item.get('enabled') is False: continue kind = item.get('kind') if kind in counts: counts[kind] += 1 labels = [f'<{kind.title()} {i}>' for kind, count in counts.items() for i in range(1, count + 1)] if counts['video'] or counts['picture'] > 9 or counts['audio'] > 3: labels = None # Video audio routing and loader overflow need the evaluated map. return review_prompt(pkg['prompt_text'], pkg['builder_state'], expected_text=render_prompt(state) if supported else None, reference_labels=labels, duration=state.get('duration'), package_revision=revision, seed=pkg['seed']) def save_immutable(directory, key, payload): directory.mkdir(parents=True, exist_ok=True) target = directory / (key + '.json') if target.exists(): if target.read_text(encoding='utf-8') != payload: raise ValueError('Saved snapshot changed: ' + key) return target pending = directory / ('.' + key + '.' + uuid.uuid4().hex + '.tmp') try: with pending.open('x', encoding='utf-8') as stream: stream.write(payload) try: target.hardlink_to(pending) except FileExistsError: if target.read_text(encoding='utf-8') != payload: raise ValueError('Saved snapshot changed: ' + key) finally: pending.unlink(missing_ok=True) return target shot_id, = inputs pkg = resolve_shot_package(shot_id) payload = json.dumps(pkg, sort_keys=True, ensure_ascii=False, separators=(',', ':'), allow_nan=False) revision = hashlib.sha256(payload.encode('utf-8')).hexdigest() snapshot = save_immutable(SNAPSHOTS, revision, payload) review = package_review(pkg, revision) review_path = save_immutable(SNAPSHOTS.parent / 'prompt_reviews', review['review_sha256'], json.dumps(review, sort_keys=True, ensure_ascii=False, separators=(',', ':'), allow_nan=False)) summary = dict(shot_id=pkg['shot_id'], prompt_name=pkg['prompt_name'], seed=pkg['seed'], transition=pkg['transition'], revision=revision, snapshot=str(snapshot), schema='workflow-monitor.runtime.v1', kind='prompt_review', values=review, review_file=str(review_path), authority='Committed prompt, media and RefMod libraries; linked widgets are previews') outputs[:] = [pkg['prompt_text'], json.dumps(pkg['builder_state'], separators=(',', ':')), json.dumps(pkg['media_state'], separators=(',', ':')), json.dumps(pkg['stack_state'], separators=(',', ':')), int(pkg['seed']), str(pkg['transition']), json.dumps(summary, ensure_ascii=False, indent=2)]"
